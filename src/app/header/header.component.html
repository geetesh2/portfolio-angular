<header class="header">
  <div class="logo">
    <span>&lt;Geetesh /&gt;</span>
  </div>

  <!-- Hamburger Icon -->
  <div class="hamburger" (click)="toggleMenu()" fxHide.gt-sm>&#9776;</div>

  <!-- Navigation Links -->
  <nav
    class="nav-links"
    [class.open]="isMenuOpen"
    [ngClass]="{ mobile: isMobileScreen }"
  >
    <a
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Home</a
    >
    <a
      routerLink="/about"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >About</a
    >
    <a
      routerLink="/projects"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Projects</a
    >
    <a
      routerLink="/contact"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Contact</a
    >
  </nav>
</header>
